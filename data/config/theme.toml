# DESCRIPTION:     Główna konfiguracja motywu graficznego i palety barw (Theme).
#                  Centralizuje definicje kolorów tła, nagłówków, akcentów oraz
#                  stanów tekstu dla całego interfejsu użytkownika silnika.
# ----------------------------------------------------------------------------
# PATH:            data/config/theme.toml
# CREATED:         2026-08-24
# ============================================================================

# @formatter:off

[backgrounds]
# Główne tło okna i aplikacji (#12161A)
app_dark        = { r = 18, g = 22, b = 26, a = 255 }
# Tło nagłówków i belek tytułowych (#1A222D)
header_dark     = { r = 26, g = 34, b = 45, a = 255 }
# Tło lewego panelu kategorii (#161B22)
pane_left       = { r = 22, g = 27, b = 34, a = 255 }
# Tło prawego panelu szczegółów (#0E1114)
pane_right      = { r = 14, g = 17, b = 20, a = 255 }

[accents]
# Złoty akcent aktywnych elementów (#FFCB00)
gold            = { r = 255, g = 203, b = 0, a = 255 }
# Cyjanowy akcent nagłówków i zaznaczeń (#50DCF0)
cyan            = { r = 80, g = 220, b = 240, a = 255 }
# Bordowy odcień marginesów Viewportu (#5A1423)
crimson         = { r = 90, g = 20, b = 35, a = 255 }

[borders]
# Standardowy stonowany kolor ramek (#3C4B5F)
muted           = { r = 60, g = 75, b = 95, a = 255 }

[text]
# Główny jasny tekst (#F5F5F5)
primary         = { r = 245, g = 245, b = 245, a = 255 }
# Szary tekst pomocniczy (#AAAAAA)
secondary       = { r = 170, g = 170, b = 170, a = 255 }
# Przyciemniony tekst wyłączonych opcji (#5A5F69)
disabled        = { r = 90, g = 95, b = 105, a = 255 }

# @formatter:on
