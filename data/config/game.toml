# DESCRIPTION:     Główna konfiguracja rozgrywki, profili gracza i aplikacji.
#                  Zarządza czasem trwania ekranu startowego Splash (0 = wyłączony),
#                  aktywnym profilem gracza oraz domyślnym językiem lokalizacji.
# ----------------------------------------------------------------------------
# PATH:            data/config/game.toml
# CREATED:         2026-08-24
# ============================================================================


# @formatter:off

[app]
splash_duration_sec   = 7.0     # Czas trwania ekranu Splash (0.0 = natychmiastowe menu)
language              = "pl"    # Kod języka i18n ("pl", "en", "de")
dev_mode              = true    # Tryb deweloperski (nakładki diagnostyczne)

[profile]
# Aktywny profil gracza (podkatalog w data/saves/, np. "default", "gracz_1")
active_profile        = "default"

# @formatter:on
