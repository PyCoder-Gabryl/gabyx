# DESCRIPTION:     Konfiguracja interfejsu uzytkownika (HUD) dla silnika Gabyx.
#                  Definiuje 3 profile wymiarow paskow (Compact, Standard,
#                  HiDPI), skale czcionek oraz palete kolorystyczna tla dla
#                  poszczegolnych stanow i widokow paskow (Widok A / Widok B).
# ----------------------------------------------------------------------------
# PATH:            data/config/hud.toml
# CREATED:         2026-08-23
# ============================================================================


# @formatter:off

[hud]
active_tier           = "auto"

[tiers.compact]
top_height            = 32
bottom_height         = 96
font_size             = 14

[tiers.standard]
top_height            = 40
bottom_height         = 120
font_size             = 18

[tiers.hidpi]
top_height            = 80
bottom_height         = 240
font_size             = 24

[colors.top_view_a]
r                     = 42
g                     = 52
b                     = 65
a                     = 255

[colors.top_view_b]
r                     = 52
g                     = 48
b                     = 70
a                     = 255

[colors.bottom_view_a]
r                     = 38
g                     = 44
b                     = 54
a                     = 255

[colors.bottom_view_b]
r                     = 32
g                     = 50
b                     = 56
a                     = 255

[colors.viewport]
r                     = 90
g                     = 20
b                     = 35
a                     = 255

# @formatter:on
