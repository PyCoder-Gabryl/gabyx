# DESCRIPTION:     Konfiguracja interfejsu uzytkownika (HUD) dla silnika Gabyx.
#                  Definiuje 3 profile wymiarow paskow (Compact, Standard,
#                  HiDPI), skale czcionek oraz palete kolorystyczna tla dla
#                  poszczegolnych stanow i widokow paskow (Widok A / Widok B).
# ----------------------------------------------------------------------------
# PATH:            data/config/hud.toml
# CREATED:         2026-08-23
# ============================================================================


# @formatter:off

# ============================================================================
# GABYX - KONFIGURACJA INTERFEJSU UŻYTKOWNIKA (HUD TOML)
# ============================================================================

[hud]
# Domyślny profil: "auto" (dobierany do szerokości okna), "compact", "standard", "hidpi"
active_tier           = "auto"

# ----------------------------------------------------------------------------
# 3 PROFILE WYMIARÓW I SKALOWANIA HUD-U
# ----------------------------------------------------------------------------
[tiers.compact]
# Format małych ekranów (W < 1600 px)
top_height            = 32
bottom_height         = 96
font_size             = 14

[tiers.standard]
# Format standardowy (1600 px <= W <= 2560 px)
top_height            = 40
bottom_height         = 120
font_size             = 18

[tiers.hidpi]
# Format Ultra-DPI / 4K / 5K (W > 2560 px)
top_height            = 80
bottom_height         = 240
font_size             = 24

# ----------------------------------------------------------------------------
# PALETA TŁA KONTENERÓW I STANY WIDOKÓW A/B (RGBA)
# ----------------------------------------------------------------------------
[colors.top_view_a]
# Pasek górny - Widok A: Stalowy błękitny łupek (#2A3441)
r                     = 42
g                     = 52
b                     = 65
a                     = 255

[colors.top_view_b]
# Pasek górny - Widok B: Średnie indygo (#343046)
r                     = 52
g                     = 48
b                     = 70
a                     = 255

[colors.bottom_view_a]
# Pasek dolny - Widok A: Grafitowy łupek (#262C36)
r                     = 38
g                     = 44
b                     = 54
a                     = 255

[colors.bottom_view_b]
# Pasek dolny - Widok B: Ciemny morski antracyt (#203238)
r                     = 32
g                     = 50
b                     = 56
a                     = 255

[colors.viewport]
# Środkowy obszar Viewportu lochu: Wyraziste bordo (#5A1423)
r                     = 90
g                     = 20
b                     = 35
a                     = 255
# @formatter:on
